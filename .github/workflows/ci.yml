name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # projectStore integration tests hit a real Postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localcloud
          POSTGRES_PASSWORD: localcloud
          POSTGRES_DB: localcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localcloud"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://localcloud:localcloud@127.0.0.1:5432/localcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The MCP smoke boots the real backend + stdio MCP server against the service Postgres
      - run: npm run mcp:smoke

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      # Absolute path: environment variables don't expand ~
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: terraform-plugins-${{ hashFiles('tests/golden/**/provider.tf') }}
      # The compiled blueprints in tests/golden must be valid Terraform for every environment
      - run: npm run validate:golden
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins

  e2e:
    # Playwright 1.57 can't install its browser on Ubuntu 26.04 (ubuntu-latest); pin until it's upgraded
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localcloud
          POSTGRES_PASSWORD: localcloud
          POSTGRES_DB: localcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localcloud"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://localcloud:localcloud@127.0.0.1:5432/localcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Browser tests against the built app; Terraform runs are mocked, so no Docker or Terraform needed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
