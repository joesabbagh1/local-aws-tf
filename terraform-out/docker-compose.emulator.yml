# ============================================================================
# Multi-Environment AWS Emulator Cluster (dev, testing, staging, prod)
# Each environment runs an isolated in-memory AWS Emulator on its dedicated port
# ============================================================================
services:
  aws-emulator-dev:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: aws-emulator:local
    container_name: localcloud-aws-emulator-dev
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      - HOME=${HOME}
      - EMULATOR_TELEMETRY=off
    volumes:
      - "${HOME}/.aws/emulator:${HOME}/.aws/emulator"
    command: ["-p", "9297", "--telemetry", "off", "--auth", "on"]
    deploy:
      resources:
        limits:
          memory: 2G

  aws-emulator-testing:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: aws-emulator:local
    container_name: localcloud-aws-emulator-testing
    ports:
      - "127.0.0.1:9298:9298"
    environment:
      - HOME=${HOME}
      - EMULATOR_TELEMETRY=off
    volumes:
      - "${HOME}/.aws/emulator:${HOME}/.aws/emulator"
    command: ["-p", "9298", "--telemetry", "off", "--auth", "on"]
    deploy:
      resources:
        limits:
          memory: 2G

  aws-emulator-staging:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: aws-emulator:local
    container_name: localcloud-aws-emulator-staging
    ports:
      - "127.0.0.1:9299:9299"
    environment:
      - HOME=${HOME}
      - EMULATOR_TELEMETRY=off
    volumes:
      - "${HOME}/.aws/emulator:${HOME}/.aws/emulator"
    command: ["-p", "9299", "--telemetry", "off", "--auth", "on"]
    deploy:
      resources:
        limits:
          memory: 2G

  aws-emulator-prod:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: aws-emulator:local
    container_name: localcloud-aws-emulator-prod
    ports:
      - "127.0.0.1:9300:9300"
    environment:
      - HOME=${HOME}
      - EMULATOR_TELEMETRY=off
    volumes:
      - "${HOME}/.aws/emulator:${HOME}/.aws/emulator"
    command: ["-p", "9300", "--telemetry", "off", "--auth", "on"]
    deploy:
      resources:
        limits:
          memory: 2G
